workflow:
  name: light
  description: >
    Light review lane. The roles are the `.md` definitions under agents/ —
    planner writes the plan, a fresh Opus 5 reviews it cold (up to two
    revisions by the planner), a human gates it, then the planner executes
    it phase by phase dispatching the implementer. A DIFFERENT model writes
    the tests, and the inspector plus the two consultants review the result.
  version: 0.3.0
  entry_point: token_baseline

  runtime:
    provider: claude
    default_model: claude-opus-5
    # max_tokens deliberately UNSET. On the Anthropic path max_tokens covers
    # thinking + visible answer combined, so setting it would clamp extended
    # thinking. Left None so the provider uses its own ceiling.
    timeout: 3600

  # CRITICAL: `explicit` means an agent sees ONLY what its `input:` list
  # names. The default (`accumulate`) hands every prior agent's output to
  # every later agent, which would let the "fresh" reviewer read the
  # planner's reasoning and defeat the point of separating them.
  context:
    mode: explicit

  limits:
    timeout_seconds: 28800
    max_iterations: 40

  cost:
    enabled: true

  input:
    task:
      type: string
      required: true
      description: What to build. The planner's sole instruction.
    repo:
      type: string
      required: true
      description: Absolute path to the repository the agents operate on.
    agents_dir:
      type: string
      required: true
      description: >
        Directory holding the role definitions. Every role in this lane is
        loaded from a `.md` in here — nothing below restates what a role
        does, so editing the definition changes the lane.
    plan_engine:
      type: string
      required: false
      default: claude-code
      description: >
        Engine running the definition-backed roles. claude-code is the
        default because it is the only one with a real system-prompt
        channel; the others get the definition prepended to the prompt,
        which is the same text with weaker separation.
    plan_model:
      type: string
      required: false
      default: ""
      description: >
        The model every definition-backed role runs on. No definition
        declares one, so this is where the choice lives. Empty means the
        engine's own default.
    impl_agent:
      type: string
      required: false
      default: implementer
      description: >
        Which implementation role the planner dispatches. There is one, and
        it declares no model — the engine comes from `plan_engine`, so the
        role stays the same whoever executes it.
    test_engine:
      type: string
      required: false
      default: opencode
    test_model:
      type: string
      required: false
      default: parley/openai/gpt-5.6-luna
      description: >
        Model for test authoring. Deliberately NOT the implementer's, so
        the test author does not inherit its blind spots.
    run_security:
      type: string
      required: false
      default: "true"
    run_perf:
      type: string
      required: false
      default: "true"
    run_dir:
      type: string
      required: true
    scripts_dir:
      type: string
      required: true

agents:
  - name: token_baseline
    type: script
    description: Snapshot account-wide usage before anything runs.
    command: "{{ workflow.input.scripts_dir }}/token-report.py"
    args: ["--phase", "before"]
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
    timeout: 300
    routes:
      - to: preflight

  # ── PREFLIGHT ────────────────────────────────────────────────────────
  # Quota is per-model: one model can be capped while another works.
  # Probing once up front lets the run degrade deliberately instead of
  # dying halfway through.
  - name: preflight
    type: script
    description: Probe engine availability before any real tokens are spent.
    command: "{{ workflow.input.scripts_dir }}/preflight.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      PLAN_ENGINE: "{{ workflow.input.plan_engine }}"
      PLAN_MODEL: "{{ workflow.input.plan_model | default('claude-fable-5', true) }}"
      TEST_ENGINE: "{{ workflow.input.test_engine }}"
      TEST_MODEL: "{{ workflow.input.test_model }}"
      IMPL_AGENT: "{{ workflow.input.impl_agent }}"
    timeout: 900
    routes:
      - when: "{{ not preflight.output.ready }}"
        to: engines_unavailable
      - to: plan

  # ── PLAN — agents/planner.md, Agent tool withheld ────────────────────
  # The definition has the planner both plan AND dispatch. Withholding the
  # Agent tool here is what splits those two halves apart, so the review
  # panel and the human gate land between them.
  - name: plan
    type: script
    description: The planner writes .plans/<task-slug>.md and stops.
    input:
      - workflow.input.task
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: plan
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 7200
    routes:
      # Declining a task too small to plan, and halting to ask the human a
      # question, are both correct planner outcomes. Neither is an error,
      # and neither should spend implementation tokens.
      - when: "{{ plan.output.declined }}"
        to: planner_declined
      - to: review_1

  # ── REVIEW 1 — fresh Opus 5 ──────────────────────────────────────────
  - name: review_1
    type: agent
    description: First review. Sees the plan, never the planner's reasoning.
    provider: claude
    model: claude-opus-5
    reasoning:
      effort: max
    input:
      - workflow.input.task
      - plan.output.plan_markdown
      - plan.output.phase_count
    system_prompt: >
      You are reviewing an implementation plan written by someone else. You
      did not write it and have no stake in it. Find what is wrong before
      anyone spends compute executing it. A vague objection is worse than
      no objection.
    prompt: |
      Original task:
      {{ workflow.input.task }}

      Proposed plan ({{ plan.output.phase_count }} phases):
      {{ plan.output.plan_markdown }}

      The plan is executed one phase at a time by a single implementer whose
      entire context is this file plus a per-phase dispatch derived from it.
      No conversation, no ability to ask questions.

      Review in priority order:
      1. CORRECTNESS — will this accomplish the task? What does it miss?
      2. PHASE BOUNDARIES — each phase must leave the tree compiling with
         existing tests passing. Does any phase change a symbol whose
         consumers are only updated in a later phase? Is any file created
         and never wired in by the last phase?
      3. SELF-CONTAINMENT — is every decision the implementer needs already
         closed in the text? No open questions, no "handle the edge cases",
         no alternatives left live.
      4. VERIFICATION — is every automated-verification line a literal
         command, and does it distinguish done from not-done?

      `approved` only if you would run it as-is. `revise` if sound but
      flawed. `reject` if the approach itself is wrong.

      Think as long as you need. There is no budget on reasoning.
    output:
      verdict: { type: string, description: "approved, revise, or reject" }
      blocking_issues: { type: array }
      review_notes: { type: string }
    routes:
      - when: "{{ review_1.output.verdict == 'reject' }}"
        to: plan_rejected
      - when: "{{ review_1.output.verdict == 'revise' }}"
        to: revise_1
      - to: approval_gate

  # ── REVISION 1 — the planner, same plan path ─────────────────────────
  # Revisions go back through the planner rather than to a generic rewriter:
  # its definition owns the plan file, the rule that completed phases and
  # their ticked checkboxes survive a rewrite, and the replan budget.
  - name: revise_1
    type: script
    description: First of at most two planner revisions.
    input:
      - plan.output.plan_path
      - review_1.output.blocking_issues
      - review_1.output.review_notes
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: revise
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      FINDINGS: |
        Blocking issues:
        {{ review_1.output.blocking_issues }}

        Full review notes:
        {{ review_1.output.review_notes }}
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 7200
    routes:
      - to: review_2

  # ── REVIEW 2 — fresh Opus 5 ──────────────────────────────────────────
  - name: review_2
    type: agent
    description: Second review, against the once-revised plan.
    provider: claude
    model: claude-opus-5
    reasoning:
      effort: max
    input:
      - workflow.input.task
      - revise_1.output.plan_markdown
      - revise_1.output.planner_message
    system_prompt: >
      You are reviewing a plan that has already been through one revision
      cycle. Judge the plan in front of you on its merits. Do not defer to
      it because it was revised.
    prompt: |
      Original task:
      {{ workflow.input.task }}

      Revised plan:
      {{ revise_1.output.plan_markdown }}

      What the planner says it changed:
      {{ revise_1.output.planner_message }}

      Same criteria: correctness, phase boundaries, self-containment,
      verification. Verify the claimed changes were actually made.

      This is the final review before the last revision opportunity. If you
      return `revise`, one more pass happens and then it goes to the gate
      regardless.

      Think as long as you need. There is no budget on reasoning.
    output:
      verdict: { type: string, description: "approved, revise, or reject" }
      blocking_issues: { type: array }
      review_notes: { type: string }
    routes:
      - when: "{{ review_2.output.verdict == 'reject' }}"
        to: plan_rejected
      - when: "{{ review_2.output.verdict == 'revise' }}"
        to: revise_2
      - to: approval_gate

  # ── REVISION 2 — final ───────────────────────────────────────────────
  - name: revise_2
    type: script
    description: Second and final revision. No third review follows.
    input:
      - plan.output.plan_path
      - review_2.output.blocking_issues
      - review_2.output.review_notes
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: revise
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      FINDINGS: |
        This is the FINAL revision — the next step is a human gate, then
        execution. Anything still broken after this ships to the implementer.

        Remaining blocking issues:
        {{ review_2.output.blocking_issues }}

        Reviewer's notes:
        {{ review_2.output.review_notes }}
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 7200
    routes:
      - to: approval_gate

  # ── HUMAN GATE ───────────────────────────────────────────────────────
  - name: approval_gate
    type: human_gate
    description: Last look before any implementation tokens are spent.
    input:
      - plan.output.plan_path
      - plan.output.plan_markdown
      - revise_1.output.plan_markdown?
      - revise_2.output.plan_markdown?
      - preflight.output.notes
      - preflight.output.degraded
    prompt: |
      Review lane: LIGHT (one reviewer, up to 2 planner revisions)

      Engine status:
      {% if preflight.output.degraded %}DEGRADED — {{ preflight.output.notes }}
      {% else %}all engines available{% endif %}

      Plan: {{ plan.output.plan_path }}

      {{ revise_2.output.plan_markdown
         | default(revise_1.output.plan_markdown
         | default(plan.output.plan_markdown, true), true) }}

      Proceed to implementation?
    options:
      - label: Approve — the planner executes this plan
        value: approve
        route: implement
      - label: Abort
        value: abort
        route: plan_rejected

  # ── IMPLEMENT — the planner, Agent tool restored ─────────────────────
  # One invocation, not a driver loop. The phase-by-phase dispatch, the
  # `blocked` / `plan-is-wrong` / `bad-dispatch` handling, the resume rules,
  # and the 2-replan / 1-re-dispatch budgets are all specified in
  # planner.md. Re-implementing them out here would fork the seam that
  # planner.md and implementer.md define between them.
  - name: implement
    type: script
    description: The planner executes the approved plan, dispatching implementers.
    input:
      - plan.output.plan_path
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: implement
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      IMPL_AGENT: "{{ workflow.input.impl_agent }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 28800
    routes:
      - when: "{{ preflight.output.tests_available }}"
        to: tests
      - to: review_panel

  # ── TESTS — a different model from the implementer ───────────────────
  - name: tests
    type: script
    description: Test authoring on a different engine than the implementer.
    input:
      - implement.output.planner_message
    command: "{{ workflow.input.scripts_dir }}/agent-tests.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      TEST_ENGINE: "{{ workflow.input.test_engine }}"
      TEST_MODEL: "{{ workflow.input.test_model }}"
      PLAN_MARKDOWN: "{{ plan.output.plan_markdown }}"
      IMPL_REPORT: "{{ implement.output.planner_message }}"
    timeout: 7200
    routes:
      - to: review_panel

  # ── REVIEW PANEL — inspector + the two consultants ───────────────────
  # Roles and gating come from the definitions: the inspector gates,
  # security findings gate because each one already cleared its own bar,
  # and the performance consultant never gates.
  - name: review_panel
    type: script
    description: inspector, security-consultant, performance-consultant — concurrent.
    input:
      - plan.output.plan_markdown
      - implement.output.planner_message
    command: "{{ workflow.input.scripts_dir }}/agent-review.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      PLAN_MARKDOWN: "{{ plan.output.plan_markdown }}"
      IMPL_REPORT: "{{ implement.output.planner_message }}"
      RUN_SECURITY: "{{ workflow.input.run_security }}"
      RUN_PERF: "{{ workflow.input.run_perf }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
    timeout: 14400
    routes:
      - to: implementation_validator

  # ── VALIDATE — fresh Opus 5, judges the ORIGINAL task ────────────────
  - name: implementation_validator
    type: agent
    description: >
      Independent of the planner and of the panel. Judges the finished work
      against the ORIGINAL task — a faithfully executed wrong plan still
      fails here, which is the one thing plan-conformance review cannot
      catch.
    provider: claude
    model: claude-opus-5
    reasoning:
      effort: max
    input:
      - workflow.input.task
      - implement.output.planner_message
      - implement.output.escalated
      - tests.output?
      - review_panel.output.findings_summary
      - review_panel.output.blocking
    system_prompt: >
      You are validating work produced by other agents. You did not plan it
      and did not write it. Your only allegiance is to the original task.
      Every report below is a claim, not evidence.
    prompt: |
      Original task:
      {{ workflow.input.task }}

      What the planner reports:
      {{ implement.output.planner_message }}

      Escalated: {{ implement.output.escalated }}

      Test author:
      {{ tests.output | default({}, true) }}

      Review panel verdicts: {{ review_panel.output.findings_summary }}
      Blocking: {{ review_panel.output.blocking }}

      The panel already covered correctness, plan conformance, security, and
      performance. Do NOT re-derive their findings. Answer the one question
      none of them was asked:

      Does the result accomplish the ORIGINAL task as stated? A plan can be
      executed perfectly, pass every check, satisfy every reviewer, and still
      not solve the problem that was asked for.

      Also account for anything the panel could not see: work the planner
      escalated, phases left unexecuted, and any claim above that the panel's
      verdicts contradict.

      Think as long as you need. There is no budget on reasoning.
    output:
      verdict: { type: string, description: "pass, pass_with_issues, or fail" }
      task_satisfied: { type: boolean }
      gaps: { type: array, description: What the task asked for and did not get. }
      validation_notes: { type: string }
    routes:
      - to: token_report

  # ── TOKEN LEDGER ─────────────────────────────────────────────────────
  - name: token_report
    type: script
    description: >
      Reconciles Conductor's UsageTracker (Claude provider agents) with the
      normalized JSON each engine adapter emits (script agents) into one
      before/after ledger.
    command: "{{ workflow.input.scripts_dir }}/token-report.py"
    args: ["--phase", "after"]
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
    timeout: 300
    routes:
      - to: $end

  - name: planner_declined
    type: terminate
    status: success
    reason: >
      The planner wrote no plan. Either the change is too small to plan and
      it returned the one-line instruction, or a decision belongs to the
      human and it asked. Read `plan.output.planner_message`. Both outcomes
      are correct and no implementation tokens were spent.

  - name: engines_unavailable
    type: terminate
    status: failed
    reason: >
      Preflight could not reach the engine that runs the definition-backed
      roles. There is no fallback for it — every role in this lane is a
      `.md` definition, and running them somewhere else would be a different
      lane, not a degraded one.

  - name: plan_rejected
    type: terminate
    status: failed
    reason: >
      Plan not approved — a reviewer rejected it or the operator aborted at
      the gate. No implementation tokens spent.

# Guarded with `is defined` — the terminate paths skip everything after the
# gate, and an unguarded reference would blow up on abort.
output:
  lane: light
  degraded: "{{ preflight.output.degraded }}"
  plan_path: >-
    {% if plan is defined %}{{ plan.output.plan_path }}{% else %}none{% endif %}
  planner_message: >-
    {% if plan is defined %}{{ plan.output.planner_message }}{% else %}{% endif %}
  revisions_applied: >-
    {% if revise_2 is defined %}2{% elif revise_1 is defined %}1{% else %}0{% endif %}
  implementation_escalated: >-
    {% if implement is defined %}{{ implement.output.escalated }}{% else %}n/a{% endif %}
  panel: >-
    {% if review_panel is defined %}{{ review_panel.output.findings_summary }}{% else %}not_reached{% endif %}
  blocking: >-
    {% if review_panel is defined %}{{ review_panel.output.blocking }}{% else %}[]{% endif %}
  final_verdict: >-
    {% if implementation_validator is defined %}{{ implementation_validator.output.verdict }}{% else %}not_reached{% endif %}
  task_satisfied: >-
    {% if implementation_validator is defined %}{{ implementation_validator.output.task_satisfied }}{% else %}false{% endif %}
  token_ledger: >-
    {% if token_report is defined %}{{ token_report.output.stdout }}{% else %}{}{% endif %}
