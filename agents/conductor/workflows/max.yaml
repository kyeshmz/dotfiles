workflow:
  name: max
  description: >
    Max review lane. The roles are the `.md` definitions under agents/ —
    planner writes the plan, then three reviewers examine it independently
    (Opus 5, an independent-family reviewer via antigravity, and a model
    that reads the actual repository), a fourth Opus 5 adjudicates them, and
    the planner revises against the adjudicated findings. After the gate the
    planner executes it phase by phase dispatching the implementer, a
    DIFFERENT model writes the tests, and the inspector plus the two
    consultants review the result.
  version: 0.3.0
  entry_point: token_baseline

  runtime:
    provider: claude
    default_model: claude-opus-5
    # max_tokens deliberately UNSET. On the Anthropic path max_tokens covers
    # thinking + visible answer combined, so setting it would clamp extended
    # thinking. Left None so the provider uses its own ceiling.
    timeout: 3600

  # CRITICAL: `explicit` means an agent sees ONLY what its `input:` list
  # names. The default (`accumulate`) hands every prior agent's output to
  # every later agent — which would let each reviewer read the others'
  # findings and collapse three independent opinions into an echo.
  context:
    mode: explicit

  limits:
    timeout_seconds: 36000
    max_iterations: 40

  cost:
    enabled: true

  input:
    task:
      type: string
      required: true
      description: What to build. The planner's sole instruction.
    repo:
      type: string
      required: true
      description: Absolute path to the repository the agents operate on.
    agents_dir:
      type: string
      required: true
      description: >
        Directory holding the role definitions. Every role in this lane is
        loaded from a `.md` in here — nothing below restates what a role
        does, so editing the definition changes the lane.
    plan_engine:
      type: string
      required: false
      default: claude-code
    plan_model:
      type: string
      required: false
      default: ""
      description: >
        The model every definition-backed role runs on. No definition
        declares one, so this is where the choice lives. Empty means the
        engine's own default.
    impl_agent:
      type: string
      required: false
      default: implementer
      description: >
        Which implementation role the planner dispatches. There is one, and
        it declares no model — the engine comes from `plan_engine`, so the
        role stays the same whoever executes it.
    test_engine:
      type: string
      required: false
      default: opencode
    test_model:
      type: string
      required: false
      default: parley/openai/gpt-5.6-luna
    code_review_engine:
      type: string
      required: false
      default: opencode
    code_review_model:
      type: string
      required: false
      default: parley/openai/gpt-5.6-terra
      description: Model for the repository-grounded plan review.
    gemini_model:
      type: string
      required: false
      default: gemini-3-pro
      description: >
        Model for the independent reviewer, served by the antigravity CLI.
        If antigravity is not installed, Opus 5 via claude code stands in
        and the result is flagged as NOT cross-family.
    run_security:
      type: string
      required: false
      default: "true"
    run_perf:
      type: string
      required: false
      default: "true"
    run_dir:
      type: string
      required: true
    scripts_dir:
      type: string
      required: true

agents:
  - name: token_baseline
    type: script
    description: Snapshot account-wide usage before anything runs.
    command: "{{ workflow.input.scripts_dir }}/token-report.py"
    args: ["--phase", "before"]
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
    timeout: 300
    routes:
      - to: preflight

  - name: preflight
    type: script
    description: Probe engine availability before any real tokens are spent.
    command: "{{ workflow.input.scripts_dir }}/preflight.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      PLAN_ENGINE: "{{ workflow.input.plan_engine }}"
      PLAN_MODEL: "{{ workflow.input.plan_model | default('claude-fable-5', true) }}"
      TEST_ENGINE: "{{ workflow.input.test_engine }}"
      TEST_MODEL: "{{ workflow.input.test_model }}"
      GEMINI_MODEL: "{{ workflow.input.gemini_model }}"
      IMPL_AGENT: "{{ workflow.input.impl_agent }}"
    timeout: 900
    routes:
      - when: "{{ not preflight.output.ready }}"
        to: engines_unavailable
      - to: plan

  # ── PLAN — agents/planner.md, Agent tool withheld ────────────────────
  # The definition has the planner both plan AND dispatch. Withholding the
  # Agent tool here is what splits those two halves apart, so the review
  # panel and the human gate land between them.
  - name: plan
    type: script
    description: The planner writes .plans/<task-slug>.md and stops.
    input:
      - workflow.input.task
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: plan
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 7200
    routes:
      - when: "{{ plan.output.declined }}"
        to: planner_declined
      - to: external_reviews

  # ── REVIEWS B + C — concurrently, outside Conductor ──────────────────
  # Conductor rejects script steps in both `parallel:` and `for_each`
  # groups, and neither reviewer has a native provider — so they run as
  # background jobs inside one script step.
  #
  # Sequencing this before opus_review costs wall-clock, NOT independence:
  # under `context.mode: explicit` an agent sees only what its `input:`
  # list names, and opus_review does not list these outputs. It cannot read
  # them regardless of execution order.
  - name: external_reviews
    type: script
    description: >
      Independent-family reviewer (antigravity, else Opus 5 via claude
      code) and a repository-grounded reviewer, run concurrently.
    input:
      - plan.output.plan_markdown
      - plan.output.plan_path
    command: "{{ workflow.input.scripts_dir }}/external-reviews.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      GEMINI_MODEL: "{{ workflow.input.gemini_model }}"
      CODE_REVIEW_ENGINE: "{{ workflow.input.code_review_engine }}"
      CODE_REVIEW_MODEL: "{{ workflow.input.code_review_model }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      PLAN_MARKDOWN: "{{ plan.output.plan_markdown }}"
    timeout: 5400
    routes:
      - to: opus_review

  # ── REVIEW A — Opus 5 ────────────────────────────────────────────────
  # Deliberately does NOT list external_reviews.output in its input, so it
  # reviews the plan blind to what the other two said.
  - name: opus_review
    type: agent
    description: Opus 5 reviewer. Reasoning depth is its contribution.
    provider: claude
    model: claude-opus-5
    reasoning:
      effort: max
    input:
      - workflow.input.task
      - plan.output.plan_markdown
      - plan.output.phase_count
    system_prompt: >
      You are reviewing an implementation plan written by someone else. Two
      other reviewers are examining this same plan independently and cannot
      see your findings, nor you theirs. Do not hedge toward a consensus you
      cannot observe - state what you actually think.
    prompt: |
      Original task:
      {{ workflow.input.task }}

      Proposed plan ({{ plan.output.phase_count }} phases):
      {{ plan.output.plan_markdown }}

      The plan is executed one phase at a time by a single implementer whose
      entire context is this file plus a per-phase dispatch derived from it.
      No conversation, no ability to ask questions.

      Review in priority order:
      1. CORRECTNESS — will this accomplish the task? What does it miss?
      2. PHASE BOUNDARIES — each phase must leave the tree compiling with
         existing tests passing. Does any phase change a symbol whose
         consumers are only updated in a later phase? Is any file created
         and never wired in by the last phase?
      3. SELF-CONTAINMENT — is every decision the implementer needs already
         closed in the text? No open questions, no "handle the edge cases",
         no alternatives left live.
      4. VERIFICATION — is every automated-verification line a literal
         command, and does it distinguish done from not-done?

      `approved` only if you would run it as-is. `revise` if sound but
      flawed. `reject` if the approach itself is wrong.

      Think as long as you need. There is no budget on reasoning.
    output:
      verdict: { type: string, description: "approved, revise, or reject" }
      blocking_issues: { type: array }
      review_notes: { type: string }
    routes:
      - to: review_synthesizer

  # ── SYNTHESIZE — fresh Opus 5 adjudicates ────────────────────────────
  # It adjudicates; it does NOT rewrite the plan. The plan file has exactly
  # one author, and giving a second agent write access to it would break the
  # ownership rule the planner and implementer both depend on. Its output is
  # a consolidated finding list, which the planner then revises against.
  - name: review_synthesizer
    type: agent
    description: >
      A fresh Opus 5 that neither wrote the plan nor reviewed it.
      Adjudicates the three reviews into one finding list.
    provider: claude
    model: claude-opus-5
    reasoning:
      effort: max
    input:
      - workflow.input.task
      - plan.output.plan_markdown
      - opus_review.output.verdict
      - opus_review.output.blocking_issues
      - opus_review.output.review_notes
      - external_reviews.output.independent
      - external_reviews.output.code
      - external_reviews.output.reviewers_available
      - external_reviews.output.reviewers_missing
      - external_reviews.output.independent_family_present
      - external_reviews.output.independent_transport
    system_prompt: >
      You are adjudicating three independent reviews of a plan you did not
      write. The reviewers could not see each other's findings, so overlap
      between them is real signal and disagreement is real information -
      neither is noise. Where they conflict, reason about WHY: a reviewer
      with repository access knows things the others cannot, and a reviewer
      without it may object to something that is actually fine.

      You do not rewrite the plan. The plan file has one author and you are
      not it. Your output is the finding list that author revises against.
    prompt: |
      Original task:
      {{ workflow.input.task }}

      Plan under review:
      {{ plan.output.plan_markdown }}

      ── Reviewer A — Opus 5 (reasoning depth) ──
      Verdict: {{ opus_review.output.verdict }}
      Blocking issues: {{ opus_review.output.blocking_issues }}
      Notes: {{ opus_review.output.review_notes }}

      ── Reviewer B — independent family ──
      Transport: {{ external_reviews.output.independent_transport }}
      Genuinely cross-family: {{ external_reviews.output.independent_family_present }}
      {{ external_reviews.output.independent }}

      ── Reviewer C — read the actual repository ──
      {{ external_reviews.output.code }}

      Answered: {{ external_reviews.output.reviewers_available }}
      Did NOT answer: {{ external_reviews.output.reviewers_missing }}

      Do this:

      1. Note any reviewer that was unavailable or skipped, and say so in
         `reviewers_heard`. A two-way review must not be reported as
         three-way.
      2. IMPORTANT — if `Genuinely cross-family` is false, Reviewer B was
         another Opus 5 standing in, not an independent model family.
         Agreement between A and B is then much weaker evidence than it
         looks: same family, same blind spots. Weight it accordingly and
         say you did.
      3. Where reviewers genuinely agree, treat the issue as confirmed.
      4. Where they disagree, adjudicate and explain. Reviewer C read the
         actual code; weight its grounding claims accordingly.
      5. Where a reviewer is simply wrong, say so, drop it, and record it in
         `dismissed` — a finding you pass on becomes work someone does.
      6. Write `findings_for_planner` as the complete, self-contained brief
         the plan's author will revise against. It sees this text and the
         plan file, nothing else: no reviewer names it cannot resolve, no
         "as discussed", no reference to this conversation. Each finding
         names the phase or path it applies to and what must change.

      Set verdict `approved` if nothing needs to change, `revise` if the
      findings are fixable, and `reject` only if all recoverable paths are
      exhausted.

      Think as long as you need. There is no budget on reasoning.
    output:
      verdict: { type: string, description: "approved, revise, or reject" }
      findings_for_planner: { type: string, description: The self-contained revision brief. }
      reviewers_heard: { type: array, description: Which reviewers actually reported. }
      confirmed_issues: { type: array, description: Issues more than one reviewer raised. }
      disputed_issues: { type: array, description: Disagreements and how you resolved them. }
      dismissed: { type: array, description: Findings you judged wrong, and why. }
    routes:
      - when: "{{ review_synthesizer.output.verdict == 'reject' }}"
        to: plan_rejected
      - when: "{{ review_synthesizer.output.verdict == 'revise' }}"
        to: revise
      - to: approval_gate

  # ── REVISE — the planner, same plan path ─────────────────────────────
  - name: revise
    type: script
    description: The planner revises against the adjudicated findings.
    input:
      - plan.output.plan_path
      - review_synthesizer.output.findings_for_planner
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: revise
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      FINDINGS: "{{ review_synthesizer.output.findings_for_planner }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 7200
    routes:
      - to: approval_gate

  # ── HUMAN GATE ───────────────────────────────────────────────────────
  - name: approval_gate
    type: human_gate
    description: Last look before any implementation tokens are spent.
    input:
      - plan.output.plan_path
      - plan.output.plan_markdown
      - revise.output.plan_markdown?
      - review_synthesizer.output.reviewers_heard
      - review_synthesizer.output.confirmed_issues
      - review_synthesizer.output.disputed_issues
      - review_synthesizer.output.dismissed
      - external_reviews.output.independent_family_present
      - preflight.output.notes
      - preflight.output.degraded
    prompt: |
      Review lane: MAX (three reviewers, synthesized by Opus 5)

      Engine status:
      {% if preflight.output.degraded %}DEGRADED — {{ preflight.output.notes }}
      {% else %}all engines available{% endif %}

      Cross-family second opinion present:
      {{ external_reviews.output.independent_family_present }}

      Reviewers heard from:
      {{ review_synthesizer.output.reviewers_heard }}

      Confirmed issues (more than one reviewer):
      {{ review_synthesizer.output.confirmed_issues }}

      Disputed issues and resolutions:
      {{ review_synthesizer.output.disputed_issues }}

      Dismissed as wrong:
      {{ review_synthesizer.output.dismissed }}

      ── Plan: {{ plan.output.plan_path }} ──
      {{ revise.output.plan_markdown | default(plan.output.plan_markdown, true) }}

      Proceed to implementation?
    options:
      - label: Approve — the planner executes this plan
        value: approve
        route: implement
      - label: Abort
        value: abort
        route: plan_rejected

  # ── IMPLEMENT — the planner, Agent tool restored ─────────────────────
  # One invocation, not a driver loop. The phase-by-phase dispatch, the
  # `blocked` / `plan-is-wrong` / `bad-dispatch` handling, the resume rules,
  # and the 2-replan / 1-re-dispatch budgets are all specified in
  # planner.md. Re-implementing them out here would fork the seam that
  # planner.md and implementer.md define between them.
  - name: implement
    type: script
    description: The planner executes the approved plan, dispatching implementers.
    input:
      - plan.output.plan_path
    command: "{{ workflow.input.scripts_dir }}/agent-plan.sh"
    env:
      MODE: implement
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      IMPL_AGENT: "{{ workflow.input.impl_agent }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
      MODEL: "{{ workflow.input.plan_model }}"
    timeout: 28800
    routes:
      - when: "{{ preflight.output.tests_available }}"
        to: tests
      - to: review_panel

  # ── TESTS — a different model from the implementer ───────────────────
  - name: tests
    type: script
    description: Test authoring on a different engine than the implementer.
    input:
      - implement.output.planner_message
    command: "{{ workflow.input.scripts_dir }}/agent-tests.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      TEST_ENGINE: "{{ workflow.input.test_engine }}"
      TEST_MODEL: "{{ workflow.input.test_model }}"
      PLAN_MARKDOWN: "{{ plan.output.plan_markdown }}"
      IMPL_REPORT: "{{ implement.output.planner_message }}"
    timeout: 7200
    routes:
      - to: review_panel

  # ── REVIEW PANEL — inspector + the two consultants ───────────────────
  - name: review_panel
    type: script
    description: inspector, security-consultant, performance-consultant — concurrent.
    input:
      - plan.output.plan_markdown
      - implement.output.planner_message
    command: "{{ workflow.input.scripts_dir }}/agent-review.sh"
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
      SCRIPTS_DIR: "{{ workflow.input.scripts_dir }}"
      REPO: "{{ workflow.input.repo }}"
      AGENTS_DIR: "{{ workflow.input.agents_dir }}"
      TASK: "{{ workflow.input.task }}"
      PLAN_PATH: "{{ plan.output.plan_path }}"
      PLAN_MARKDOWN: "{{ plan.output.plan_markdown }}"
      IMPL_REPORT: "{{ implement.output.planner_message }}"
      RUN_SECURITY: "{{ workflow.input.run_security }}"
      RUN_PERF: "{{ workflow.input.run_perf }}"
      ENGINE: "{{ workflow.input.plan_engine }}"
    timeout: 14400
    routes:
      - to: implementation_validator

  # ── VALIDATE — fresh Opus 5, judges the ORIGINAL task ────────────────
  - name: implementation_validator
    type: agent
    description: >
      Independent of the planner and of the panel. Judges the finished work
      against the ORIGINAL task — a faithfully executed wrong plan still
      fails here, which is the one thing plan-conformance review cannot
      catch.
    provider: claude
    model: claude-opus-5
    reasoning:
      effort: max
    input:
      - workflow.input.task
      - implement.output.planner_message
      - implement.output.escalated
      - tests.output?
      - review_panel.output.findings_summary
      - review_panel.output.blocking
    system_prompt: >
      You are validating work produced by other agents. You did not plan it
      and did not write it. Your only allegiance is to the original task.
      Every report below is a claim, not evidence.
    prompt: |
      Original task:
      {{ workflow.input.task }}

      What the planner reports:
      {{ implement.output.planner_message }}

      Escalated: {{ implement.output.escalated }}

      Test author:
      {{ tests.output | default({}, true) }}

      Review panel verdicts: {{ review_panel.output.findings_summary }}
      Blocking: {{ review_panel.output.blocking }}

      The panel already covered correctness, plan conformance, security, and
      performance. Do NOT re-derive their findings. Answer the one question
      none of them was asked:

      Does the result accomplish the ORIGINAL task as stated? A plan can be
      executed perfectly, pass every check, satisfy every reviewer, and still
      not solve the problem that was asked for.

      Also account for anything the panel could not see: work the planner
      escalated, phases left unexecuted, and any claim above that the panel's
      verdicts contradict.

      Think as long as you need. There is no budget on reasoning.
    output:
      verdict: { type: string, description: "pass, pass_with_issues, or fail" }
      task_satisfied: { type: boolean }
      gaps: { type: array, description: What the task asked for and did not get. }
      validation_notes: { type: string }
    routes:
      - to: token_report

  - name: token_report
    type: script
    description: >
      Reconciles Conductor's UsageTracker (Claude provider agents) with the
      normalized JSON each engine adapter emits (script agents) into one
      before/after ledger.
    command: "{{ workflow.input.scripts_dir }}/token-report.py"
    args: ["--phase", "after"]
    env:
      RUN_DIR: "{{ workflow.input.run_dir }}"
    timeout: 300
    routes:
      - to: $end

  - name: planner_declined
    type: terminate
    status: success
    reason: >
      The planner wrote no plan. Either the change is too small to plan and
      it returned the one-line instruction, or a decision belongs to the
      human and it asked. Read `plan.output.planner_message`. Both outcomes
      are correct and no implementation tokens were spent.

  - name: engines_unavailable
    type: terminate
    status: failed
    reason: >
      Preflight could not reach the engine that runs the definition-backed
      roles. There is no fallback for it — every role in this lane is a
      `.md` definition, and running them somewhere else would be a different
      lane, not a degraded one.

  - name: plan_rejected
    type: terminate
    status: failed
    reason: >
      Plan not approved — the synthesizer rejected it or the operator
      aborted at the gate. No implementation tokens spent.

# Guarded with `is defined` — the terminate paths skip everything after the
# gate, and an unguarded reference would blow up on abort.
output:
  lane: max
  degraded: "{{ preflight.output.degraded }}"
  plan_path: >-
    {% if plan is defined %}{{ plan.output.plan_path }}{% else %}none{% endif %}
  planner_message: >-
    {% if plan is defined %}{{ plan.output.planner_message }}{% else %}{% endif %}
  cross_family_review: >-
    {% if external_reviews is defined %}{{ external_reviews.output.independent_family_present }}{% else %}false{% endif %}
  reviewers_heard: >-
    {% if review_synthesizer is defined %}{{ review_synthesizer.output.reviewers_heard }}{% else %}[]{% endif %}
  revised: >-
    {% if revise is defined %}true{% else %}false{% endif %}
  implementation_escalated: >-
    {% if implement is defined %}{{ implement.output.escalated }}{% else %}n/a{% endif %}
  panel: >-
    {% if review_panel is defined %}{{ review_panel.output.findings_summary }}{% else %}not_reached{% endif %}
  blocking: >-
    {% if review_panel is defined %}{{ review_panel.output.blocking }}{% else %}[]{% endif %}
  final_verdict: >-
    {% if implementation_validator is defined %}{{ implementation_validator.output.verdict }}{% else %}not_reached{% endif %}
  task_satisfied: >-
    {% if implementation_validator is defined %}{{ implementation_validator.output.task_satisfied }}{% else %}false{% endif %}
  token_ledger: >-
    {% if token_report is defined %}{{ token_report.output.stdout }}{% else %}{}{% endif %}
